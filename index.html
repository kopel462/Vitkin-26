<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<!--VITKIN_BUILD=9-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>ניהול הוצאות הדירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#0f766e; --brand-d:#0b5c55; --brand-l:#ccfbf1;
    --green:#16a34a; --green-l:#dcfce7; --amber:#d97706; --amber-l:#fef3c7;
    --red:#dc2626; --red-l:#fee2e2; --blue:#2563eb; --blue-l:#dbeafe;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px rgba(15,23,42,.15);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    font-size:16px;line-height:1.6;word-spacing:.03em;padding-bottom:88px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px;padding-inline:max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-right))}

  /* Header */
  header{
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
    color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 22px;box-shadow:var(--shadow);
    position:sticky;top:0;z-index:50;
  }
  .head-top{display:flex;align-items:stretch;gap:12px}
  .head-textcol{flex:1;min-width:0}
  .head-hero-tile{width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .head-title{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
  .head-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-sub{font-size:.8rem;opacity:.85;margin-top:2px}
  .head-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{
    background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;
    border-radius:11px;font-size:1.1rem;cursor:pointer;display:grid;place-items:center;
  }
  .icon-btn:active{background:rgba(255,255,255,.3)}
  .ro-badge{background:var(--amber);color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-inline-start:6px}

  /* KPI hero */
  .hero{margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
  .hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .hero-lbl{font-size:.78rem;opacity:.85}
  .hero-val{font-size:1.5rem;font-weight:800;line-height:1.1}
  .hero-bar{height:9px;border-radius:20px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden}
  .hero-bar > i{display:block;height:100%;background:#fff;border-radius:20px;transition:width .5s}
  .hero-legend{display:flex;justify-content:space-between;font-size:.72rem;opacity:.9;margin-top:6px}
  .hero-split{display:flex;gap:8px;margin-top:10px}
  .hero-split span{flex:1;background:rgba(255,255,255,.14);border-radius:9px;padding:6px 8px;font-size:.72rem;display:flex;flex-direction:column;gap:1px}
  .hero-split b{font-size:.9rem;font-weight:700}

  /* Cards */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
  .card-h{padding:14px 16px 0;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
  .card-b{padding:14px 16px}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .kpi{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);border-inline-start:4px solid var(--line)}
  .kpi.k-budget{border-color:var(--blue)} .kpi.k-paid{border-color:var(--green)}
  .kpi.k-remain{border-color:var(--amber)} .kpi.k-commit{border-color:var(--brand)}
  .kpi .l{font-size:.76rem;color:var(--muted);font-weight:500}
  .kpi .v{font-size:1.22rem;font-weight:800;margin-top:2px}
  .kpi .s{font-size:.7rem;color:var(--muted);margin-top:2px}
  .num{unicode-bidi:isolate;direction:ltr}

  /* Category list */
  .cat{border-bottom:1px solid var(--line)}
  .cat:last-child{border-bottom:none}
  .cat-head{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer}
  .cat-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.25rem;background:var(--brand-l);flex-shrink:0}
  .cat-info{flex:1;min-width:0}
  .cat-name{font-weight:700;font-size:.98rem}
  .cat-meta{font-size:.75rem;color:var(--muted);margin-top:1px}
  .cat-amt{text-align:end;flex-shrink:0}
  .cat-amt .t{font-weight:700}
  .cat-amt .p{font-size:.72rem;color:var(--muted)}
  .cat-bar{height:5px;background:var(--line);border-radius:20px;margin:0 16px 11px;overflow:hidden}
  .cat-bar > i{display:block;height:100%;border-radius:20px;background:var(--green)}
  .chev{color:var(--muted);font-size:.85rem;transition:transform .2s}
  .cat.open .chev{transform:rotate(90deg)}
  .items{display:none;background:#fafbfc;padding:2px 0}
  .cat.open .items{display:block}
  .item{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 16px;border-top:1px solid var(--line)}
  .item-info{flex:1;min-width:0}
  .item-desc{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-sup{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:1px}
  .item-mini{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:5px;font-size:.74rem;color:var(--muted)}
  .item-mini b{color:var(--ink)}
  .item.is-paid{background:#f0fdf4}
  .item.is-paid .item-desc{color:#15803d}
  .ok{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:1rem;font-weight:800;flex-shrink:0;box-shadow:0 2px 5px rgba(22,163,74,.4)}
  .cat-ok{color:#fff;background:var(--green);font-size:.64rem;font-weight:700;padding:1px 7px 2px;border-radius:20px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
  .cat-inc{color:var(--blue);background:var(--blue-l);font-size:.64rem;font-weight:700;padding:1px 7px 2px;border-radius:20px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
  .item-balance{background:#fffbeb;border-inline-start:3px solid var(--amber)}
  .item-balance .item-desc{color:var(--amber)}
  .cat-edit{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:4px 6px;flex-shrink:0}
  .cat-edit:active{color:var(--brand)}
  .item-amt{text-align:end;flex-shrink:0}
  .item-amt .t{font-weight:700;font-size:.9rem}
  .item-amt .p{font-size:.7rem}
  .pill{font-size:.68rem;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap}
  .pill.paid{background:var(--green-l);color:#15803d}
  .pill.partial{background:var(--amber-l);color:#b45309}
  .pill.due{background:var(--red-l);color:#b91c1c}
  .pill.plan{background:var(--blue-l);color:#1d4ed8}
  .item-edit{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:6px;flex-shrink:0}
  .cat-add{width:100%;text-align:start;background:none;border:none;color:var(--brand);font-weight:600;font-size:.85rem;padding:11px 16px;cursor:pointer;border-top:1px solid var(--line)}

  /* Timeline */
  .tl-month{font-weight:800;font-size:.95rem;color:var(--brand-d);margin:18px 0 8px;padding-inline-start:4px}
  .tl-month .m-sum{float:inline-end;color:var(--muted);font-weight:600;font-size:.82rem}
  .tl-item{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:9px;display:flex;align-items:center;gap:11px;border-inline-start:4px solid var(--line)}
  .tl-item.paid{border-color:var(--green);opacity:.7}
  .tl-item.due{border-color:var(--red)}
  .tl-item.plan{border-color:var(--blue)}
  .tl-date{text-align:center;flex-shrink:0;min-width:44px}
  .tl-date .d{font-size:1.3rem;font-weight:800;line-height:1}
  .tl-date .mo{font-size:.68rem;color:var(--muted)}
  .tl-body{flex:1;min-width:0}
  .tl-t{font-weight:600;font-size:.9rem}
  .tl-s{font-size:.75rem;color:var(--muted)}
  .tl-amt{font-weight:800;text-align:end}

  /* Buttons */
  .btn{border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:.95rem;padding:13px 16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:active{background:var(--brand-d)}
  .btn-ghost{background:var(--bg);color:var(--ink)}
  .btn-danger{background:var(--red-l);color:var(--red)}
  .btn-row{display:flex;gap:10px}
  .btn-sm{padding:10px 14px;font-size:.88rem}

  /* Bottom nav */
  .nav{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:none;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;font-family:inherit}
  .nav button .ni{font-size:1.3rem}
  .nav button .nl{font-size:.68rem;font-weight:600}
  .nav button.on{color:var(--brand)}

  /* FAB */
  .fab{position:fixed;inset-inline-end:16px;bottom:82px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:1.8rem;box-shadow:var(--shadow-lg);cursor:pointer;z-index:55;display:grid;place-items:center}
  .fab:active{background:var(--brand-d)}

  /* Views */
  .view{display:none;padding-top:14px}
  .view.active{display:block}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty .e-ic{font-size:2.5rem;margin-bottom:8px}

  /* Modal / Sheet */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{position:relative;background:#fff;width:100%;max-width:760px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grab{width:40px;height:4px;background:var(--line);border-radius:20px;margin:8px auto 12px}
  .sheet h3{margin:0 0 14px;font-size:1.15rem}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:1rem;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  .field-row{display:flex;gap:10px}
  .field-row > div{flex:1}
  .hint{font-size:.74rem;color:var(--muted);margin-top:4px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg label{margin:0;flex:1;min-width:70px}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:9px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
  .seg input:checked + span{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
  .toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:.9rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}

  /* settings rows */
  .set-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .set-row:last-child{border:none}
  .set-row .t{font-weight:600;font-size:.92rem}
  .set-row .d{font-size:.76rem;color:var(--muted);margin-top:1px}
  /* budget block */
  .bud-cap{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bud-cap .l{font-size:.8rem;color:var(--muted)}
  .bud-cap .v{font-size:1.5rem;font-weight:800}
  .bud-remain{text-align:center;padding:12px;border-radius:12px;margin-top:12px;font-weight:700}
  .bud-remain.bok{background:var(--green-l);color:#15803d}
  .bud-remain.bover{background:var(--red-l);color:#b91c1c}
  .bud-remain .big{display:block;font-size:1.5rem;margin-top:2px}
  .bud-bar{height:16px;border-radius:20px;background:var(--line);overflow:hidden;display:flex;margin:14px 0 8px}
  .bud-bar > i{display:block;height:100%}
  .bud-bar .p-paid{background:var(--green)} .bud-bar .p-commit{background:var(--amber)}
  .bud-legend{display:flex;gap:14px;font-size:.74rem;color:var(--muted);flex-wrap:wrap}
  .bud-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
  .bud-mini{display:flex;justify-content:space-between;text-align:center;margin-top:14px;gap:6px}
  .bud-mini > div{flex:1;background:var(--bg);border-radius:10px;padding:8px 4px}
  .bud-mini .l{font-size:.72rem;color:var(--muted)}
  .bud-mini .v{font-weight:800;font-size:.98rem;margin-top:2px}
  .bwarn{background:var(--amber-l);color:#b45309;font-size:.8rem;padding:9px 12px;border-radius:10px;margin-top:12px;font-weight:600}
  /* budget category row — stacked, no overlap */
  .brow{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .brow:last-child{border:none}
  .brow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bname{font-weight:600;font-size:.92rem}
  .bchip{font-size:.76rem;font-weight:700;white-space:nowrap}
  .bchip.free{color:var(--green)} .bchip.over{color:var(--red)}
  .bbar{height:7px;border-radius:20px;background:var(--line);overflow:hidden;margin:8px 0}
  .bbar > i{display:block;height:100%;border-radius:20px}
  .brow-nums{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
  .brow-nums b{color:var(--ink)}
  .zone-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--brand-d);background:var(--brand-l);padding:9px 12px;border-radius:10px;margin:16px 0 4px}
  .zone-h .zone-sum{font-weight:600;font-size:.76rem;color:var(--brand-d);opacity:.8}
  .movebtn{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:32px;height:30px;font-size:.7rem;cursor:pointer;color:var(--muted);line-height:1;padding:0}
  .movebtn:active{background:var(--brand-l);color:var(--brand)}
  .cat-move{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .cat-move button{background:var(--bg);border:1px solid var(--line);border-radius:6px;width:26px;height:19px;font-size:.58rem;line-height:1;color:var(--muted);cursor:pointer;padding:0}
  .cat-move button:active{background:var(--brand-l);color:var(--brand)}
  /* parts checklist */
  .parts-toggle{font-size:.78rem;color:var(--brand);font-weight:600;cursor:pointer;margin-top:9px;user-select:none}
  .parts-list{margin-top:6px;display:flex;flex-direction:column;gap:1px}
  .part{display:flex;align-items:center;gap:10px;font-size:.88rem;padding:7px 4px;border-radius:8px;cursor:pointer}
  .part input[type=checkbox]{width:19px;height:19px;flex-shrink:0;accent-color:var(--green)}
  .part span{flex:1}
  .part.done span{color:#15803d;font-weight:600}
  .part-del{background:none;border:none;color:var(--muted);font-size:1.15rem;cursor:pointer;padding:0 6px;line-height:1}
  .part-add{display:flex;gap:6px;margin-top:8px}
  .part-add input{flex:1;padding:9px 11px;font-size:.9rem;border:1.5px solid var(--line);border-radius:10px;font-family:inherit}
  .part-add button{background:var(--brand);color:#fff;border:none;border-radius:10px;width:42px;font-size:1.2rem;cursor:pointer;flex-shrink:0}
  /* attachments */
  .att-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .att{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:10px;padding:9px 11px;font-size:.88rem}
  .att-ic{flex-shrink:0}
  .att-name{flex:1;color:var(--brand);cursor:pointer;text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-del{background:none;border:none;color:var(--muted);font-size:1.15rem;cursor:pointer;padding:0 4px;line-height:1}
  .files-chip{color:var(--brand);font-weight:600;cursor:pointer;background:var(--brand-l);padding:1px 8px;border-radius:20px}
  .sheet-x{position:absolute;top:12px;inset-inline-start:14px;background:var(--bg);border:none;border-radius:50%;width:34px;height:34px;font-size:1rem;color:var(--muted);cursor:pointer;z-index:3;display:grid;place-items:center}
  .cat-search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:1rem;margin-bottom:12px;background:#fff;color:var(--ink)}
  .cat-search:focus{outline:none;border-color:var(--brand)}
  /* overview status cards */
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
  .stat-row .k{font-size:.85rem;color:var(--muted)}
  .stat-row b{font-size:1.2rem;font-weight:800}
  .split2{display:flex;gap:10px;margin:14px 0 4px}
  .split-box{flex:1;border-radius:12px;padding:11px 10px;text-align:center}
  .split-box.paid{background:var(--green-l)} .split-box.due{background:var(--amber-l)}
  .split-box .l{font-size:.72rem;color:var(--muted)}
  .split-box .v{font-weight:800;font-size:1.02rem;margin-top:3px}
  .split-box.paid .v{color:#15803d} .split-box.due .v{color:#b45309}
  .split-box .s{font-size:.72rem;margin-top:3px}
  .split-box.paid .s{color:#15803d} .split-box.due .s{color:#b45309}
  .thin-bar{height:9px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:10px}
  .thin-bar > i{display:block;height:100%;border-radius:20px;background:var(--green)}
  .card-h .link{font-weight:700;font-size:.82rem;color:var(--brand);cursor:pointer;background:none;border:none}
  canvas{max-height:230px}
  .chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:.78rem}
  .chart-legend span{display:flex;align-items:center;gap:6px}
  .chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="head-title">
        <img id="headHero" class="head-hero-tile" style="display:none" alt="תמונת הפרויקט" title="לחץ להחלפת התמונה">
        <span id="projName">ויתקין 26</span>
        <em id="roBadge" class="ro-badge" style="display:none;font-style:normal">צפייה בלבד</em>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="btnBack" title="חזרה" style="display:none">›</button>
        <button class="icon-btn" id="btnShare" title="שיתוף">⤴</button>
        <button class="icon-btn" id="btnSettingsTop" title="הגדרות">⚙</button>
      </div>
    </div>
    <div class="head-sub" id="headSub"></div>
    <div class="hero">
      <div class="hero-main">
        <div>
          <div class="hero-lbl">שולם עד כה</div>
          <div class="hero-val num" id="heroPaid">₪0</div>
        </div>

// ---------- קבצים מצורפים (קבלות/אחריות) — נשמרים בענן בנפרד מהנתונים ----------
function readFileDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function compressImageDataURL(dataURL,maxDim,q){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>maxDim){const s=maxDim/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.onerror=()=>res(dataURL);img.src=dataURL;});}
async function uploadAttachment(file){
  if(!filesRef)throw new Error('no cloud');
  let dataURL=await readFileDataURL(file);
  if((file.type||'').indexOf('image/')===0)dataURL=await compressImageDataURL(dataURL,1400,0.7);
  const approx=Math.round(dataURL.length*0.75);
  if(approx>6*1024*1024)throw new Error('too big');
  const fid=uid();
  await filesRef.child(fid).set({name:file.name,type:file.type||'',data:dataURL});
  return {id:fid,name:file.name,type:file.type||'',size:approx};
}
function dataURLtoBlob(dataURL){
  const parts=dataURL.split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(parts[1]);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function showImageModal(src,name){

}
function openAttachment(fid,ftype,fname){
  if(!filesRef)return;
  const isImg=(ftype||'').indexOf('image/')===0;

  if(!isImg){ win=window.open('','_blank'); } // פתיחת חלון סינכרונית (למחוות משתמש) לקבצי PDF
  filesRef.child(fid).once('value').then(snap=>{const f=snap.val();if(!f){toast('הקובץ לא נמצא');if(win)win.close();return;}
    if((f.type||'').indexOf('image/')===0 || isImg){ showImageModal(f.data,f.name||fname); if(win)win.close(); return; }
    try{ const url=URL.createObjectURL(dataURLtoBlob(f.data)); if(win){win.location=url;}else{window.open(url,'_blank');} setTimeout(()=>URL.revokeObjectURL(url),60000); }
    catch(e){ if(win)win.close(); toast('לא ניתן לפתוח את הקובץ'); }
  }).catch(()=>{ if(win)win.close(); toast('שגיאה בפתיחת הקובץ'); });
}
function deleteAttachment(fid){ if(filesRef)filesRef.child(fid).remove(); }
function pushCloud(){ if(fbRef && !VIEW){ try{ fbRef.set(JSON.parse(JSON.stringify(data))); }catch(e){ console.warn('cloud push failed',e); } } }
function fixArrays(d){ d.items=d.items||[]; d.categories=d.categories||[];
  d.categories.forEach(c=>{ if(c.parts&&!Array.isArray(c.parts))c.parts=Object.values(c.parts); if(c.files&&!Array.isArray(c.files))c.files=Object.values(c.files); });
  d.items.forEach(i=>{ if(i.files&&!Array.isArray(i.files))i.files=Object.values(i.files); });
  return d; }
function initCloud(){
  if(!fbRef)return;
  if(VIEW){ RO=true;
    fbRef.on('value',snap=>{ const v=snap.val(); if(v){ data=fixArrays(migrate(v)); render(); } });
    return;
  }
  // בעלים: סנכרון חד-פעמי בטעינה — הצד העדכני יותר מנצח
  fbRef.once('value').then(snap=>{
    const v=snap.val();
    if(v && (v.updatedAt||0) > (data.updatedAt||0)){ data=fixArrays(migrate(v)); render(); }
    else { pushCloud(); }
  }).catch(e=>console.warn('cloud read failed',e));
}

// ממיר נתונים ישנים (סכום ששולם ב-₪) למודל אחוזים
function migrate(d){
  (d.items||[]).forEach(it=>{
    if(it.paidPct===undefined){
      it.paidPct = (+it.total>0) ? clampPct((+it.paid||0)/(+it.total)*100) : (+it.paid>0?100:0);
    }
    delete it.paid;
  });
  // העברת שם הספק מרמת הסעיף לרמת הקטגוריה (תאימות לאחור)
  (d.categories||[]).forEach(c=>{
    if(!c.supplier){
      const withSup=(d.items||[]).find(i=>i.cat===c.id&&i.supplier&&i.supplier!=='קבלן / מוכר');
      if(withSup)c.supplier=withSup.supplier;
    }
  });
  // הקצאת תפקידים לאבני הדרך של הדירה (תאימות לאחור)
  if(d.advancePct===undefined)d.advancePct=20;
  if(d.advancePaid===undefined)d.advancePaid=false;
  if(d.budgetCap===undefined)d.budgetCap=1000000;
  (d.items||[]).forEach(i=>{
    if(i.cat==='apt'&&!i.role&&i.desc){
      if(/מקדמה|20%/.test(i.desc))i.role='advance';
      else if(/יתרה|80%/.test(i.desc))i.role='balance';
    }
  });
  const pr=d.project||{};
  const a=(d.items||[]).find(i=>i.role==='advance');
  const b=(d.items||[]).find(i=>i.role==='balance');
  // תיקון אוטומטי: מחיר מלא הוזן בשורת המקדמה, והאחוז ששולם הוא בעצם אחוז המקדמה
  if(a&&b&&(+b.total||0)===0&&(+a.total||0)>0&&!d.aptPrice){
    const p=clampPct(a.paidPct);
    if(p>0&&p<100){
      const price=+a.total, advAmt=Math.round(price*p/100);
      d.aptPrice=price; d.advancePct=p; d.advancePaid=true;
      a.total=advAmt; a.paidPct=100; a.status='auto'; a.desc=`מקדמה ${p}% (חתימת חוזה)`;
      b.total=price-advAmt; b.status='auto'; b.desc=`יתרה ${100-p}% (קבלת מפתח)`;
    }
  }
  if(a&&!a.due&&pr.contractDate)a.due=pr.contractDate;
  if(b&&!b.due&&pr.keyDate)b.due=pr.keyDate;
  // הקצאת תקציב ראשונית לפי בנצ'מרק (פעם אחת, לא דורס ערכים קיימים)
  if(!d.seededBenchmark){
    const pal=['#0ea5e9','#a16207','#9a3412','#4f46e5','#be185d','#0891b2','#7c3aed','#16a34a'];
    const byId={design:75000,kitchen:170000,furn:130000,elec:60000,sanit:55000,appl:70000,misc:90000};
    const byName={'עורך דין':20000};
    (d.categories||[]).forEach(c=>{
      if(c.id==='apt')return;
      if(!(+c.plan)){ if(byId[c.id]!=null)c.plan=byId[c.id]; else if(byName[c.name]!=null)c.plan=byName[c.name]; }
    });
    const names=new Set((d.categories||[]).map(c=>c.name));
    const add=[
      {name:'מיזוג אוויר',icon:'❄️',plan:45000},
      {name:'ריצוף ופרקט',icon:'🧱',plan:75000},
      {name:'נגרות וארונות',icon:'🚪',plan:75000},
      {name:'דלתות ואלומיניום',icon:'🪟',plan:55000},
      {name:'צבע וגבס',icon:'🎨',plan:30000}
    ];
    add.forEach((x,i)=>{ if(!names.has(x.name)) d.categories.push({id:uid(),name:x.name,icon:x.icon,color:pal[i%pal.length],plan:x.plan,budget:0}); });
    d.seededBenchmark=true;
  }
  // סימון קטגוריות שכלולות ברכישה (לא נספרות בתקציב)
  if(!d.seededIncluded){
    ['מיזוג אוויר','דלתות ואלומיניום'].forEach(nm=>{
      const c=(d.categories||[]).find(x=>x.name===nm);
      if(c){c.included=true;c.plan=0;}
    });
    d.seededIncluded=true;
  }
  // אימוץ מבנה תקציב מפורט חדר-בחדר (קצה נמוך). מחליף קטגוריות רחבות, שומר קטגוריות עם נתונים
  if(!d.seededDetailed){
    const pal=['#2563eb','#7c3aed','#ea580c','#0891b2','#ca8a04','#0d9488','#db2777','#16a34a','#dc2626','#4f46e5','#0ea5e9','#a16207','#9a3412','#be185d','#65a30d','#c026d3'];
    const items=d.items||[];
    const hasItems=cid=>items.some(i=>i.cat===cid);
    const rmId=['kitchen','furn','elec','sanit','appl','misc'];
    const rmName=['ריצוף ופרקט','נגרות וארונות','צבע וגבס'];
    const removeIds=new Set();
    (d.categories||[]).forEach(c=>{ if((rmId.includes(c.id)||rmName.includes(c.name))&&!hasItems(c.id)) removeIds.add(c.id); });
    d.categories=(d.categories||[]).filter(c=>!removeIds.has(c.id));
    const detailed=[
      {name:"שדרוגי קבלן (חשמל, אינסטלציה, נק')",icon:"🔧",plan:100000},

      {name:"מוצרי חשמל למטבח",icon:"🔌",plan:80000},
      {name:"נגרות לכל הבית (ארונות, ספרייה וכו')",icon:"🪚",plan:250000},
      {name:"חדרי רחצה וכלים סניטריים",icon:"🚿",plan:80000},
      {name:"ריצופים וחיפויים משלימים",icon:"🧱",plan:50000},
      {name:"תאורה",icon:"💡",plan:40000},
      {name:"וילונות והצללות",icon:"🪟",plan:40000},

  if(!d.seededTerrace){

    const removeIds=new Set();
    (d.categories||[]).forEach(c=>{ if(rmNames.includes(c.name)&&!hasItems(c.id)) removeIds.add(c.id); });
    d.categories=(d.categories||[]).filter(c=>!removeIds.has(c.id));
    const terrace=[
      {name:"מטבח חוץ (נגרות, שיש, התקנה)",icon:"🍖",plan:80000,color:'#9a3412'},
      {name:"מוצרי מטבח חוץ",icon:"🔌",plan:70000,color:'#0891b2'},

    const tnames=new Set((d.categories||[]).map(c=>c.name));

    d.seededTerrace=true;
  }
  // סעיפי פנים נוספים: גבס, בית חכם, מצלמות אבטחה (קצה נמוך)

    ];

      "ריהוט גן":["פינת ישיבה","שולחן וכיסאות","מיטות שיזוף","שמשייה"],

      "מעצבת פנים":["שכר טרחה","פיקוח","הדמיות","תוכניות עבודה"],

    };

  }
  // הקצאת אזור (פנים / חוץ / כללי) לכל קטגוריה
  if(!d.seededZones){

// ---------- calculations ----------
function itemStatus(it){
  const pct=clampPct(it.paidPct), tot=+it.total||0;
  if(tot<=0 && pct<=0) return 'plan';
  if(pct>=100 && tot>0) return 'paid';
  if(pct>0) return 'partial';
  return 'due';
}
function catTotals(cid){
  const its=data.items.filter(i=>i.cat===cid);
  let alloc=0,p=0;its.forEach(i=>{alloc+=(+i.total||0);p+=paidOf(i);});
  const c=data.categories.find(x=>x.id===cid);
  const budget=+(c&&c.budget)||0;            // עלות כוללת מול הספק (אם הוגדרה)
  const total=Math.max(budget,alloc);        // תקציב הקטגוריה
  const unalloc=Math.max(0,total-alloc);     // יתרה שטרם שויכה לאבן דרך
  return {total,paid:p,count:its.length,remain:total-p,alloc,unalloc,budget};
}
function totals(){
  let budget=0,paid=0,commit=0;
  data.categories.forEach(c=>{const ct=catTotals(c.id);budget+=ct.total;paid+=ct.paid;commit+=ct.alloc;});
  return {budget,paid,commit,remain:budget-paid};
}

// שומר על סנכרון: אבן דרך שהוגדרה כאחוז מהעלות הכוללת תתעדכן אם העלות משתנה
function normalize(){
  data.categories.forEach(c=>{
    const b=+c.budget||0; if(b<=0)return;
    data.items.forEach(i=>{if(i.cat===c.id&&i.sharePct!==null&&i.sharePct!==undefined&&i.sharePct!=='')i.total=Math.round(b*clampPct(i.sharePct)/100);});
  });
}

// ---------- render ----------

  normalize();

function upcoming(){
  return data.items.filter(i=>itemStatus(i)!=='paid' && remainOf(i)>0)
    .map(i=>({...i,outstanding:remainOf(i)}))
    .sort((a,b)=>{if(!a.due)return 1;if(!b.due)return -1;return new Date(a.due)-new Date(b.due)});
}
function futurePayments(){
  const today=new Date();today.setHours(0,0,0,0);
  return upcoming().filter(i=>i.due && new Date(i.due)>=today)
    .sort((a,b)=>new Date(a.due)-new Date(b.due));
}
function renderNextPay(){
  const up=futurePayments();const el=$('#nextPay');
  if(!up.length){el.innerHTML='<div class="empty" style="padding:20px"><div class="e-ic">📅</div>אין תשלומים עתידיים מתוזמנים.<br><span style="font-size:.82rem">הוסף תאריך יעד לסעיף כדי שיופיע כאן.</span></div>';return;}
  el.innerHTML=up.slice(0,4).map((n,i)=>{const cat=data.categories.find(c=>c.id===n.cat);const d=n.due?new Date(n.due):null;
    return `<div class="tl-item plan" style="margin:${i?'8px 0 0':'0'}">
      <div class="tl-date"><div class="d num">${d?d.getDate():'–'}</div><div class="mo">${d?d.toLocaleDateString('he-IL',{month:'short'}):''}</div></div>
      <div class="cat-ic" style="background:${(cat?.color||'#64748b')}22;color:${cat?.color||'#64748b'}">${cat?.icon||'📦'}</div>
      <div class="tl-body"><div class="tl-t">${esc(cat?.name||'')} · ${esc(n.desc)}</div><div class="tl-s">${n.due?fmtDate(n.due):'ללא תאריך'}</div></div>
      <div class="tl-amt num">${money(n.outstanding)}</div></div>`;

function renderTimeline(){
  const up=upcoming();const el=$('#timeline');
  const dated=up.filter(i=>i.due), undated=up.filter(i=>!i.due);
  if(!up.length){el.innerHTML='<div class="empty"><div class="e-ic">✅</div>הכל שולם — אין תשלומים עתידיים</div>';return;}
  const groups={};
  dated.forEach(i=>{const d=new Date(i.due);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');(groups[k]=groups[k]||[]).push(i);});
  let html='';
  Object.keys(groups).sort().forEach(k=>{
    const [y,m]=k.split('-');const mo=new Date(y,m-1,1);
    const sum=groups[k].reduce((a,i)=>a+i.outstanding,0);
    html+=`<div class="tl-month">${mo.toLocaleDateString('he-IL',{month:'long',year:'numeric'})}<span class="m-sum num">${money(sum)}</span></div>`;
    groups[k].sort((a,b)=>new Date(a.due)-new Date(b.due)).forEach(i=>{
      const cat=data.categories.find(c=>c.id===i.cat);const d=new Date(i.due);
      const cls=d<new Date()?'due':'plan';
      html+=`<div class="tl-item ${cls}"><div class="tl-date"><div class="d num">${d.getDate()}</div><div class="mo">${d.toLocaleDateString('he-IL',{month:'short'})}</div></div>
        <div class="tl-body"><div class="tl-t">${cat?.icon||''} ${esc(i.desc)}</div><div class="tl-s">${esc((cat&&cat.supplier)||cat?.name||'')}</div></div>
        <div class="tl-amt num">${money(i.outstanding)}</div></div>`;
    });
  });
  if(undated.length){
    const sum=undated.reduce((a,i)=>a+i.outstanding,0);
    html+=`<div class="tl-month">ללא תאריך יעד<span class="m-sum num">${money(sum)}</span></div>`;
    undated.forEach(i=>{const cat=data.categories.find(c=>c.id===i.cat);
      html+=`<div class="tl-item"><div class="tl-date"><div class="d">–</div></div>
        <div class="tl-body"><div class="tl-t">${cat?.icon||''} ${esc(i.desc)}</div><div class="tl-s">${esc((cat&&cat.supplier)||cat?.name||'')}</div></div>
        <div class="tl-amt num">${money(i.outstanding)}</div></div>`;});
  }
  el.innerHTML=html;
}

// יוצר/מעדכן את שתי אבני הדרך של הדירה מתוך ההגדרות (מקור אמת יחיד)
function regenApartment(){
  const price=+data.aptPrice||0;
  const adv=Math.max(0,Math.min(100,Math.round(+data.advancePct||20)));
  const bal=100-adv;
  let a=data.items.find(i=>i.role==='advance');
  let b=data.items.find(i=>i.role==='balance');
  if(!a){a={id:uid(),cat:'apt',role:'advance',supplier:'קבלן / מוכר',paidPct:0};data.items.push(a);}
  if(!b){b={id:uid(),cat:'apt',role:'balance',supplier:'קבלן / מוכר',paidPct:0};data.items.push(b);}
  const advAmt=Math.round(price*adv/100);
  a.cat='apt';a.status='auto';a.desc=`מקדמה ${adv}% (חתימת חוזה)`;
  a.total=advAmt;a.paidPct=data.advancePaid?100:0;a.due=data.project.contractDate||'';
  const credit=+data.aptCredit||0; // זיכוי/הטבה מהקבלן — מנוכה מהיתרה (התשלום האחרון)
  b.cat='apt';b.status='auto';b.desc=`יתרה ${bal}% (קבלת מפתח)`+(credit>0?' — בניכוי זיכוי':'');
  b.total=Math.max(0,price-advAmt-credit);b.due=data.project.keyDate||''; // היתרה בניכוי הזיכוי, נדרשת במסירה
}

// ---------- budget ----------
// התקציב = סכום ההקצאות לקטגוריות (מתוכנן). מספר אחד, ללא "יעד" נפרד.
function openCommitmentBreakdown(){
  const rows=data.categories.filter(c=>c.id!=='apt'&&!c.included)
    .map(c=>{const ct=catTotals(c.id);return {c,open:ct.total-ct.paid};})
    .filter(r=>r.open>0).sort((a,b)=>b.open-a.open);
  const tot=rows.reduce((a,r)=>a+r.open,0);
  sheet(`<h3>🟧 התחייבות פתוחה — ממה מורכב</h3>
    <p class="hint">עלויות/חוזים שסגרת אך טרם שולמו:</p>
    <div style="margin-top:8px">${rows.map(r=>`<div class="brow-nums" style="padding:10px 2px;border-bottom:1px solid var(--line)"><span>${r.c.icon||'📦'} ${esc(r.c.name)}</span><b class="num">${money(r.open)}</b></div>`).join('')||'<div class="hint">אין התחייבות פתוחה</div>'}</div>
    <div class="brow-nums" style="padding:12px 2px 2px;font-weight:800;font-size:1.02rem"><span>סה"כ</span><b class="num">${money(tot)}</b></div>`);
}
function budgetStats(){
  let plan=0,committed=0,paid=0;const rows=[];
  const included=[];
  data.categories.forEach(c=>{
    if(c.id==='apt')return; // רכישת הדירה מנוהלת בנפרד (מוצגת בכרטיס נפרד בסקירה)
    const ct=catTotals(c.id);
    if(c.included){ included.push(c); rows.push({c,plan:0,committed:0,paid:0,inc:true}); return; } // מוצג בתקציב, מסומן, לא נספר
    const p=+c.plan||0;
    plan+=p;committed+=ct.total;paid+=ct.paid;
    rows.push({c,plan:p,committed:ct.total,paid:ct.paid});
  });
  const cap=plan; // התקציב הכולל = סכום ההקצאות
  return {cap,plan,committed,paid,rows,included,capRemain:cap-committed,unplanned:0};
}
function renderBudget(){
  const bb=$('#budgetBlock'); if(!bb)return;
  const s=budgetStats();
  const pctPaid=s.cap>0?Math.min(100,s.paid/s.cap*100):0;
  const pctCommitOnly=s.cap>0?Math.min(100,Math.max(0,(s.committed-s.paid)/s.cap*100)):0;
  const remainCls=s.capRemain>=0?'bok':'bover';
  const remainTxt=s.capRemain>=0?'נותר להתחייב בתקציב':'חריגה מהתקציב';
  let warn='';
  if(s.plan>s.cap)warn=`⚠️ סך התכנון (${money(s.plan)}) חורג מהתקציב ב-${money(s.plan-s.cap)}`;
  else if(s.committed>s.cap)warn=`⚠️ סך החוזים חורג מהתקציב ב-${money(s.committed-s.cap)}`;
  const moveBtns=r=>RO?'':`<button class="movebtn" data-mv="up" data-id="${r.c.id}" title="הזז למעלה">▲</button><button class="movebtn" data-mv="down" data-id="${r.c.id}" title="הזז למטה">▼</button>`;
  const rowHtml=r=>{

      return `<div class="brow">
        <div class="brow-top">
          <span class="bname" data-bcat="${r.c.id}" style="cursor:pointer">${r.c.icon||'📦'} ${esc(r.c.name)}</span>

    const variance=r.plan-r.committed;
    const barPct=r.plan>0?Math.min(100,r.committed/r.plan*100):(r.committed>0?100:0);
    const barCol=r.committed>r.plan&&r.plan>0?'var(--red)':'var(--green)';
    return `<div class="brow">
      <div class="brow-top">
        <span class="bname" data-bcat="${r.c.id}" style="cursor:pointer">${r.c.icon||'📦'} ${esc(r.c.name)}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="bchip ${variance<0?'over':'free'}">${variance<0?'חריגה ':'פנוי '}${money(Math.abs(variance))}</span>
          ${moveBtns(r)}
        </span>
      </div>
      <div class="bbar"><i style="width:${barPct}%;background:${barCol}"></i></div>
      <div class="brow-nums">
        <span>מתוכנן <b class="num">${money(r.plan)}</b></span>
        <span>חוזה <b class="num">${money(r.committed)}</b></span>
        <span>שולם <b class="num">${money(r.paid)}</b></span>
      </div>
      ${partsSection(r.c)}
    </div>`;
  };
  const partsSection=c=>{
    const parts=c.parts||[];
    if(!parts.length)return '';
    const doneN=parts.filter(p=>p.done).length;
    return `<div class="parts-toggle" data-ptoggle="${c.id}">▾ מה כלול · <span data-pcount="${c.id}">${doneN}/${parts.length}</span> סומנו</div>
      <div class="parts-list" id="pl-${c.id}" style="display:none">
        ${parts.map(p=>`<label class="part ${p.done?'done':''}"><input type="checkbox" data-pcheck="${c.id}|${p.id}" ${p.done?'checked':''}><span>${esc(p.name)}</span></label>`).join('')}
      </div>`;
  };
  // קיבוץ לפי אזור עם כותרת וסכום-ביניים; אזור לא מזוהה נופל ל"פנים" כדי ששום קטגוריה לא תיעלם
  const zoneMeta=[['in','🏠 פנים'],['out','🌳 חוץ / מרפסת'],['gen','📋 כללי']];
  const zk=r=>['in','out','gen'].includes(r.c.zone)?r.c.zone:'in';
  const matchQ=r=>!budFilter||(r.c.name||'').includes(budFilter);
  let rowsHtml='';
  zoneMeta.forEach(([z,label])=>{
    const zr=s.rows.filter(r=>zk(r)===z && matchQ(r));
    if(!zr.length)return;
    const zPlan=zr.reduce((a,r)=>a+r.plan,0);
    rowsHtml+=`<div class="zone-h"><span>${label} · ${zr.length}</span><span class="zone-sum">מתוכנן ${money(zPlan)}</span></div>`;
    zr.forEach(r=>rowsHtml+=rowHtml(r));
    if(!RO&&!budFilter)rowsHtml+=`<button class="btn btn-ghost btn-sm" data-addcatzone="${z}" style="margin:4px 0 6px;width:auto">＋ הוסף קטגוריה ל${label.replace(/^\S+\s/,'')}</button>`;
  });
  bb.innerHTML=`
    <div class="card">
      <div class="card-h">תקציב עיצוב וריהוט <span style="font-weight:400;font-size:.76rem;color:var(--muted)">ללא רכישת הדירה</span></div>
      <div class="card-b">
        <div class="bud-cap">
          <div><div class="l">תקציב מתוכנן (סכום ההקצאות)</div><div class="v num">${money(s.cap)}</div></div>
        </div>
        <p class="hint" style="margin-top:4px">התקציב מחושב אוטומטית מסכום התקציב המתוכנן לכל הקטגוריות. שנה הקצאה בעריכת קטגוריה ✎.</p>
        <div class="bud-bar"><i class="p-paid" style="width:${pctPaid}%"></i><i class="p-commit" style="width:${pctCommitOnly}%"></i></div>
        <div class="bud-legend"><span><i style="background:var(--green)"></i>שולם ${money(s.paid)}</span><span class="lg-commit" style="cursor:pointer;text-decoration:underline dotted"><i style="background:var(--amber)"></i>התחייבות פתוחה ${money(Math.max(0,s.committed-s.paid))} ›</span><span><i style="background:var(--line)"></i>פנוי ${money(Math.max(0,s.capRemain))}</span></div>
        <div class="bud-remain ${remainCls}">${remainTxt}<span class="big num">${money(Math.abs(s.capRemain))}</span></div>
        <div class="bud-mini">
          <div><div class="l">חוזים (התחייבות)</div><div class="v num">${money(s.committed)}</div></div>
          <div><div class="l">שולם</div><div class="v num">${money(s.paid)}</div></div>
        </div>
        ${warn?`<div class="bwarn">${warn}</div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="card-h">מתוכנן מול בפועל לפי קטגוריה</div>
      <div class="card-b">
        ${rowsHtml||'<div class="hint">אין קטגוריות</div>'}
        <p class="hint" style="margin-top:8px">💡 קבע "תקציב מתוכנן" לכל קטגוריה (בעריכת הקטגוריה ✎) כדי לראות חריגות מוקדם. מומלץ לשמור ~10‑15% כבלת"מ.</p>
      </div>
    </div>`;
  const ec=$('#editCap'); if(ec)ec.onclick=openBudgetCap;
  bb.querySelectorAll('[data-bcat]').forEach(b=>b.onclick=()=>RO?null:openCatEdit(b.dataset.bcat));
  bb.querySelectorAll('[data-mv]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveCat(b.dataset.id,b.dataset.mv==='up'?-1:1);});
  bb.querySelectorAll('[data-addcatzone]').forEach(b=>b.onclick=()=>RO?null:openCat(b.dataset.addcatzone));

  bb.querySelectorAll('[data-pcheck]').forEach(cb=>cb.onchange=e=>{
    e.stopPropagation();const [cid,pid]=cb.dataset.pcheck.split('|');
    const c=data.categories.find(x=>x.id===cid);const p=c&&c.parts&&c.parts.find(x=>x.id===pid);if(!p)return;
    p.done=cb.checked;cb.closest('.part').classList.toggle('done',cb.checked);saveQuiet();
    const cnt=bb.querySelector('[data-pcount="'+cid+'"]');if(cnt)cnt.textContent=c.parts.filter(x=>x.done).length+'/'+c.parts.length;
  });

// הזזת קטגוריה מעלה/מטה בתוך אותו אזור (מחליף מקום עם השכן הקרוב באותו אזור)
function moveCat(id,dir){
  const cats=data.categories;
  const idx=cats.findIndex(c=>c.id===id); if(idx<0)return;
  const z=cats[idx].zone||'in';
  const isRow=c=>c.id!=='apt'&&!c.included;
  let j=idx+dir;
  while(j>=0&&j<cats.length){ if(isRow(cats[j])&&(cats[j].zone||'in')===z) break; j+=dir; }
  if(j<0||j>=cats.length)return; // אין שכן באותו אזור
  const tmp=cats[idx];cats[idx]=cats[j];cats[j]=tmp;
  save();
}

    <div style="height:1px;background:var(--line);margin:16px 0"></div>
    <div style="font-weight:700;margin-bottom:4px">🏠 הדירה — תשלום ${adv}/${100-adv}</div>
    <label>מחיר הדירה הכולל (₪)</label>
    <input id="setAptPrice" type="number" inputmode="numeric" dir="ltr" value="${data.aptPrice||''}" placeholder="0">
    <div class="field-row" style="align-items:flex-end">
      <div style="flex:0 0 110px"><label>אחוז מקדמה</label><input id="setAdv" type="number" inputmode="numeric" dir="ltr" min="0" max="100" value="${adv}"></div>
      <div style="flex:1"><label style="margin-bottom:9px">&nbsp;</label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);margin:0;cursor:pointer">
          <input id="setAdvPaid" type="checkbox" style="width:20px;height:20px" ${data.advancePaid?'checked':''}> המקדמה כבר שולמה
        </label>
      </div>
    </div>
    <div class="field-row">
      <div><label>תאריך חתימת חוזה</label><input id="setContract" type="date" dir="ltr" value="${p.contractDate||''}"></div>
      <div><label>תאריך קבלת מפתח</label><input id="setKey" type="date" dir="ltr" value="${p.keyDate||''}"></div>
    </div>
    <label>🎁 זיכוי / הטבה מהקבלן (₪)</label>
    <input id="setCredit" type="number" inputmode="numeric" dir="ltr" value="${data.aptCredit||''}" placeholder="0">
    <p class="hint">למשל זיכוי מטבח — מנוכה מהיתרה (התשלום האחרון). הספק עצמו נרשם בעלות המלאה בקטגוריה שלו.</p>
    <div id="aptPreview" style="background:var(--brand-l);border-radius:12px;padding:11px 14px;margin-top:14px;font-size:.85rem;line-height:1.7"></div>
    <div style="height:1px;background:var(--line);margin:16px 0"></div>
    <div style="font-weight:700;margin-bottom:8px">🖼️ תמונת אווירה בהאדר</div>
    <div id="heroPrev">${data.project.hero?`<img src="${data.project.hero}" style="width:100%;border-radius:12px;max-height:150px;object-fit:cover">`:'<div class="hint">לא נבחרה תמונה — ההאדר יופיע בירוק בלבד</div>'}</div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" id="heroPick" type="button">📷 בחר תמונה</button>
      ${data.project.hero?'<button class="btn btn-ghost btn-sm" id="heroClear" type="button">הסר תמונה</button>':''}
    </div>
    <input id="heroFile" type="file" accept="image/*" style="display:none">
    <button class="btn btn-primary" id="setSave" style="margin-top:16px">שמור הגדרות</button>`;
  const preview=()=>{
    const price=+$('#setAptPrice').value||0, av=Math.max(0,Math.min(100,+$('#setAdv').value||0));
    const advAmt=Math.round(price*av/100), paid=$('#setAdvPaid').checked, credit=+$('#setCredit').value||0;
    const balance=Math.max(0,price-advAmt-credit);
    $('#aptPreview').innerHTML=`מקדמה ${av}%: <b class="num">${money(advAmt)}</b> ${paid?'· ✓ שולמה':'· טרם שולמה'}`
      +(credit>0?`<br>🎁 זיכוי/הטבה: <b class="num">-${money(credit)}</b>`:'')
      +`<br>יתרה במסירה: <b class="num">${money(balance)}</b>`;
  };
  if(RO){$('#settingsBody').querySelectorAll('input,button').forEach(e=>e.disabled=true);preview();return;}
  ['#setAptPrice','#setAdv','#setCredit'].forEach(s=>$(s).oninput=preview);
  $('#setAdvPaid').onchange=preview; preview();
  // תמונת אווירה — טעינה, כיווץ ושמירה כ-base64
  $('#heroPick').onclick=()=>$('#heroFile').click();
  $('#heroFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1100;let w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      data.project.hero=cv.toDataURL('image/jpeg',0.72);save();toast('התמונה נוספה');
    };img.src=rd.result;};
    rd.readAsDataURL(f);};
  if($('#heroClear'))$('#heroClear').onclick=()=>{data.project.hero='';save();toast('התמונה הוסרה');};
  $('#setSave').onclick=()=>{
    data.project.name=$('#setName').value.trim()||'הדירה החדשה';
    data.project.contractDate=$('#setContract').value;
    data.project.keyDate=$('#setKey').value;
    data.aptPrice=+$('#setAptPrice').value||0;
    data.aptCredit=+$('#setCredit').value||0;
    data.advancePct=Math.max(0,Math.min(100,Math.round(+$('#setAdv').value||20)));
    data.advancePaid=$('#setAdvPaid').checked;
    regenApartment();
    save();toast('ההגדרות נשמרו');
  };
}

// ---------- item editor ----------
function openItem(id,presetCat){
  const it=id?data.items.find(i=>i.id===id):{id:null,cat:presetCat||data.categories[0].id,desc:'',supplier:'',total:'',paidPct:0,sharePct:null,due:''};
  const catOpts=data.categories.map(c=>`<option value="${c.id}" ${c.id===it.cat?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  const calcStyle='background:var(--brand-l);border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;font-weight:700';
  sheet(`
    <h3>${id?'עריכת אבן דרך':'הוספת אבן דרך / תשלום'}</h3>
    <label>קטגוריה / ספק</label>
    <select id="fCat">${catOpts}</select>
    <label>תיאור אבן הדרך</label>
    <input id="fDesc" dir="auto" placeholder="למשל: מקדמה / אישור תוכניות" value="${esc(it.desc||'')}">
    <div id="amtSection"></div>
    <label>תאריך תשלום / יעד</label>
    <input id="fDue" type="date" dir="ltr" value="${it.due||''}">
    <div style="height:1px;background:var(--line);margin:16px 0"></div>
    <div id="filesSection"></div>
    <button class="btn btn-primary" id="fSave" style="margin-top:18px">${id?'שמור שינויים':'הוסף אבן דרך'}</button>
    ${id?'<button class="btn btn-danger btn-sm" id="fDel" style="margin-top:10px">מחק אבן דרך</button>':''}
  `);

  function renderAmt(){
    const cat=data.categories.find(c=>c.id===$('#fCat').value);
    const budget=+(cat&&cat.budget)||0;
    if(budget>0){
      // מצב אחוזים: מזינים אחוז מהעלות הכוללת, הסכום מחושב אוטומטית
      const usedByOthers=data.items.filter(i=>i.cat===cat.id&&i.id!==id).reduce((s,i)=>s+(+i.total||0),0);
      const avail=budget-usedByOthers;
      let curShare=(it.sharePct!==null&&it.sharePct!==undefined&&it.sharePct!=='')?clampPct(it.sharePct):(it.total&&budget?clampPct(it.total/budget*100):0);
      $('#amtSection').innerHTML=`
        <div class="hint" style="margin-top:12px">עלות כוללת מול הספק: <b class="num">${money(budget)}</b> · פנוי לשיוך: <b class="num">${money(avail)}</b></div>
        <label>אחוז מהעלות הכוללת לאבן דרך זו</label>
        <div class="seg" id="pctChips">${[10,20,25,30,50].map(p=>`<label><input type="radio" name="pc" value="${p}" ${p===curShare?'checked':''}><span>${p}%</span></label>`).join('')}</div>
        <input id="fShare" type="range" min="0" max="100" step="5" value="${curShare}" style="margin-top:12px;padding:0;accent-color:var(--brand)">
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="fShareNum" type="number" inputmode="numeric" dir="ltr" min="0" max="100" value="${curShare}" style="width:90px"><span class="hint" style="margin:0">אחוז מדויק</span></div>
        <div style="${calcStyle}"><span>סכום אבן הדרך:</span><span class="num" id="calcAmt">₪0</span></div>
        <label style="margin-top:14px">שולם עד כה (₪) — למעקב פריסת תשלומים</label>
        <input id="fPaidAmt" type="number" inputmode="numeric" dir="ltr" placeholder="0" value="${it.total?paidOf(it)||'':''}">
        <div style="display:flex;gap:6px;margin-top:8px"><button type="button" class="btn btn-ghost btn-sm" id="fPaidNone" style="width:auto">איפוס</button><button type="button" class="btn btn-ghost btn-sm" id="fPaidAll" style="width:auto">שולם במלואו ✓</button></div>
        <div style="${calcStyle};margin-top:10px"><span>שולם: <span class="num" id="calcPaidA">₪0</span></span><span>נותר: <span class="num" id="calcRemA">₪0</span></span></div>`;
      const amtNow=()=>Math.round(budget*clampPct($('#fShare').value)/100);
      const recalc=()=>{const amt=amtNow();$('#calcAmt').textContent=money(amt);
        const paid=Math.max(0,Math.min(amt,+$('#fPaidAmt').value||0));
        $('#calcPaidA').textContent=money(paid);$('#calcRemA').textContent=money(amt-paid);};
      $('#fPaidAmt').oninput=recalc;
      $('#fPaidAll').onclick=()=>{$('#fPaidAmt').value=amtNow();recalc();};
      $('#fPaidNone').onclick=()=>{$('#fPaidAmt').value='';recalc();};
      const setShare=(p,from)=>{p=clampPct(p);if(from!=='range')$('#fShare').value=p;if(from!=='num')$('#fShareNum').value=p;
        document.querySelectorAll('input[name=pc]').forEach(r=>r.checked=(+r.value===p));recalc();};
      $('#fShare').oninput=()=>setShare($('#fShare').value,'range');
      $('#fShareNum').oninput=()=>setShare($('#fShareNum').value,'num');
      document.querySelectorAll('input[name=pc]').forEach(r=>r.onchange=()=>setShare(r.value,'chip'));
      recalc(); $('#amtSection').dataset.mode='pct';
    } else {
      // מצב סכום: אין עלות כוללת לקטגוריה
      const curPct=clampPct(it.paidPct);
      $('#amtSection').innerHTML=`
        <label>סכום אבן הדרך / העבודה (₪)</label>
        <input id="fTotal" type="number" inputmode="numeric" dir="ltr" placeholder="0" value="${it.total||''}">
        <label>אחוז ששולם עד כה</label>
        <div class="seg" id="pctChips">${[0,25,50,75,100].map(p=>`<label><input type="radio" name="pc" value="${p}" ${p===curPct?'checked':''}><span>${p}%</span></label>`).join('')}</div>
        <input id="fPct" type="range" min="0" max="100" step="5" value="${curPct}" style="margin-top:12px;padding:0;accent-color:var(--brand)">
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="fPctNum" type="number" inputmode="numeric" dir="ltr" min="0" max="100" value="${curPct}" style="width:90px"><span class="hint" style="margin:0">אחוז מדויק (0–100)</span></div>
        <div style="${calcStyle}"><span>שולם: <span class="num" id="calcPaid">₪0</span></span><span>נותר: <span class="num" id="calcRem">₪0</span></span></div>
        <p class="hint" style="margin-top:10px">💡 הגדר "עלות כוללת" לקטגוריה (בעריכת הקטגוריה ✎) כדי להזין אבני דרך לפי אחוז מהעלות.</p>`;
      const recalc=()=>{const tot=+$('#fTotal').value||0,pct=clampPct($('#fPct').value);
        $('#calcPaid').textContent=money(Math.round(tot*pct/100));$('#calcRem').textContent=money(tot-Math.round(tot*pct/100));};
      const setPct=(p,from)=>{p=clampPct(p);if(from!=='range')$('#fPct').value=p;if(from!=='num')$('#fPctNum').value=p;
        document.querySelectorAll('input[name=pc]').forEach(r=>r.checked=(+r.value===p));recalc();};
      $('#fPct').oninput=()=>setPct($('#fPct').value,'range');
      $('#fPctNum').oninput=()=>setPct($('#fPctNum').value,'num');
      document.querySelectorAll('input[name=pc]').forEach(r=>r.onchange=()=>setPct(r.value,'chip'));
      $('#fTotal').oninput=recalc; recalc(); $('#amtSection').dataset.mode='amt';
    }
  }
  $('#fCat').onchange=renderAmt;
  try{ renderAmt(); }catch(e){ console.warn('renderAmt failed',e); }
  try{ renderItemFiles(it); }catch(e){ console.warn('files section failed',e); }

  $('#fSave').onclick=()=>{
    const cat=data.categories.find(c=>c.id===$('#fCat').value);
    const budget=+(cat&&cat.budget)||0;
    const pctMode=$('#amtSection').dataset.mode==='pct';
    let desc=$('#fDesc').value.trim();
    if(!desc)desc=pctMode?('תשלום '+clampPct(($('#fShare')||{}).value)+'%'):'תשלום'; // תיאור אופציונלי — ברירת מחדל
    const base={cat:$('#fCat').value,desc,due:$('#fDue').value,status:'manual',files:it.files||[]};
    let o;
    if(pctMode && $('#fShare')){
      const sh=clampPct($('#fShare').value);
      const total=Math.round(budget*sh/100);
      const paidAmt=Math.max(0,Math.min(total,+($('#fPaidAmt')?$('#fPaidAmt').value:0)||0));
      o={...base,sharePct:sh,total,paidPct:total>0?clampPct(paidAmt/total*100):0};
    }else{
      o={...base,sharePct:null,total:($('#fTotal')?+$('#fTotal').value||0:(+it.total||0)),paidPct:($('#fPct')?clampPct($('#fPct').value):clampPct(it.paidPct))};
    }
    if(id){Object.assign(it,o);}else{data.items.push({id:uid(),...o});}
    close();save();toast(id?'עודכן':'נוסף');
  };
  if(id)$('#fDel').onclick=()=>{if(confirm('למחוק את אבן הדרך?')){data.items=data.items.filter(i=>i.id!==id);close();save();toast('נמחק');}};
}
// צירוף קבצים גנרי (לאבן דרך או לקטגוריה) — צילום מהנייד או העלאת קובץ
function renderItemFiles(it){ renderAttachEditor(it,'#filesSection','קבצים מצורפים (קבלות, אחריות)'); }
function renderAttachEditor(obj,elId,labelTxt){
  const el=$(elId); if(!el)return;
  if(!filesRef){el.innerHTML=`<label>📎 ${labelTxt}</label><p class="hint">צירוף קבצים זמין בגרסת האתר (עם חיבור לענן).</p>`;return;}
  obj.files=obj.files||[];
  const list=obj.files.map(f=>`<div class="att"><span class="att-ic">${(f.type||'').indexOf('image/')===0?'🖼️':'📄'}</span><span class="att-name" data-openf="${f.id}" data-ftype="${esc(f.type||'')}" data-fname="${esc(f.name||'')}">${esc(f.name||'קובץ')}</span>${RO?'':`<button class="att-del" data-delf="${f.id}" type="button">×</button>`}</div>`).join('');
  el.innerHTML=`<label>📎 ${labelTxt}</label>
    <div class="att-list">${list||'<div class="hint">אין קבצים עדיין</div>'}</div>
    ${RO?'':`<div class="btn-row" style="margin-top:8px">
      <button class="btn btn-ghost btn-sm" id="attCamBtn" type="button">📷 צלם</button>
      <button class="btn btn-ghost btn-sm" id="attFileBtn" type="button">📎 העלה קובץ</button>
    </div>
    <input id="attCam" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="attFile" type="file" accept="image/*,application/pdf" multiple style="display:none">`}`;
  el.querySelectorAll('[data-openf]').forEach(b=>b.onclick=()=>openAttachment(b.dataset.openf,b.dataset.ftype,b.dataset.fname));
  el.querySelectorAll('[data-delf]').forEach(b=>b.onclick=()=>{const fid=b.dataset.delf;obj.files=obj.files.filter(x=>x.id!==fid);deleteAttachment(fid);saveQuiet();renderAttachEditor(obj,elId,labelTxt);});
  if(RO)return;
  const handleFiles=async fl=>{const files=[...fl];if(!files.length)return;toast('מעלה...');
    for(const f of files){try{const meta=await uploadAttachment(f);obj.files.push(meta);}catch(err){toast(err&&err.message==='too big'?'קובץ גדול מדי (עד ~5MB)':'שגיאה בהעלאה');}}
    saveQuiet();renderAttachEditor(obj,elId,labelTxt);toast('נוסף');};
  $('#attCamBtn').onclick=()=>$('#attCam').click();
  $('#attFileBtn').onclick=()=>$('#attFile').click();
  $('#attCam').onchange=e=>handleFiles(e.target.files);
  $('#attFile').onchange=e=>handleFiles(e.target.files);
}

const CAT_ICONS=['🏠','✏️','🍳','🛋️','💡','🚿','📺','🚪','🪟','🎨','🔧','🌿','📦','💰','🛁','🧱'];
const CAT_COLORS=['#2563eb','#7c3aed','#ea580c','#0891b2','#ca8a04','#0d9488','#db2777','#16a34a','#dc2626'];
function iconGrid(sel){
  let list=CAT_ICONS.slice();
  if(sel&&!list.includes(sel))list.unshift(sel); // ודא שהאייקון הנוכחי תמיד קיים ומסומן
  return list.map(i=>`<label><input type="radio" name="ic" value="${i}" ${i===sel?'checked':''}><span style="font-size:1.2rem">${i}</span></label>`).join('');
}
function pickedIcon(fallback){const el=document.querySelector('input[name=ic]:checked');return el?el.value:(fallback||'📦');}
function pickedZone(fallback){const el=document.querySelector('input[name=zn]:checked');return el?el.value:(fallback||'in');}

    <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);cursor:pointer;margin-top:6px"><input id="cInc" type="checkbox" style="width:20px;height:20px" ${c.included?'checked':''}> כלול ברכישה (לא נספר בתקציב)</label>
    <div style="height:1px;background:var(--line);margin:16px 0"></div>
    <label>מה כלול בהוצאה (תתי-סעיפים) — סמן V לכל רכיב שכבר נלקח בחשבון</label>
    <div id="partsList"></div>
    <div class="part-add"><input id="partNew" dir="auto" placeholder="הוסף רכיב..."><button id="partAddBtn" type="button">＋</button></div>
    <div style="height:1px;background:var(--line);margin:16px 0"></div>
    <div id="catFiles"></div>
    <button class="btn btn-primary" id="cSave" style="margin-top:18px">שמור שינויים</button>
    <button class="btn btn-danger btn-sm" id="cDel" style="margin-top:10px">מחק קטגוריה${ct.count?` (וכל ${ct.count} הסעיפים)`:''}</button>`);
  renderPartsEditor(c);
  renderAttachEditor(c,'#catFiles','חוזה/הסכם ומסמכים');
  $('#partAddBtn').onclick=()=>{const v=$('#partNew').value.trim();if(!v)return;c.parts=c.parts||[];c.parts.push({id:uid(),name:v,done:false});$('#partNew').value='';saveQuiet();renderPartsEditor(c);};
  $('#partNew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#partAddBtn').click();}};
  $('#cSave').onclick=()=>{
    const name=$('#cName').value.trim();if(!name){toast('נא להזין שם');return;}
    c.name=name;c.supplier=$('#cSup').value.trim();c.plan=+$('#cPlan').value||0;c.budget=+$('#cBudget').value||0;c.included=$('#cInc').checked;c.zone=pickedZone(c.zone||'in');
    close();save();toast('הקטגוריה עודכנה');
  };
  $('#cDel').onclick=()=>{if(confirm('למחוק את הקטגוריה וכל הסעיפים שבה?')){
    data.items=data.items.filter(i=>i.cat!==id);
    data.categories=data.categories.filter(x=>x.id!==id);
    close();save();toast('הקטגוריה נמחקה');}};
}
function renderPartsEditor(c){
  const el=$('#partsList'); if(!el)return;
  const parts=c.parts||[];
  el.innerHTML=parts.length?parts.map(p=>`<label class="part ${p.done?'done':''}"><input type="checkbox" data-ec="${p.id}" ${p.done?'checked':''}><span>${esc(p.name)}</span><button class="part-del" data-ed="${p.id}" type="button">×</button></label>`).join(''):'<div class="hint">אין רכיבים עדיין — הוסף למטה</div>';
  el.querySelectorAll('[data-ec]').forEach(cb=>{cb.onchange=()=>{const p=(c.parts||[]).find(x=>x.id===cb.dataset.ec);if(!p)return;p.done=cb.checked;cb.closest('.part').classList.toggle('done',cb.checked);saveQuiet();};});
  el.querySelectorAll('[data-ed]').forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();c.parts=(c.parts||[]).filter(x=>x.id!==b.dataset.ed);saveQuiet();renderPartsEditor(c);};});
}

// ---------- share / export ----------
function shareLink(){
  // התמונה לא נכללת בקישור כדי לשמור אותו קצר; היא נשמרת בקובץ המיוצא
  const payload={...data,project:{...data.project,hero:undefined}};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const url=location.origin+location.pathname+'?ro=1#d='+b64;
  const editUrl=location.origin+location.pathname+'#d='+b64;
  sheet(`
    <h3>שיתוף עם בן/בת הזוג</h3>
    <p class="hint" style="margin-bottom:14px">שולח תמונת מצב נוכחית של הנתונים. הצד השני יכול לפתוח את הקישור בכל דפדפן — גם בטלפון.</p>
    <label>קישור לצפייה בלבד</label>
    <textarea id="sRo" rows="3" readonly style="font-size:.75rem;direction:ltr">${url}</textarea>
    <button class="btn btn-ghost btn-sm" id="cpRo" style="margin-top:8px">העתק קישור צפייה</button>
    <label style="margin-top:16px">קישור לצפייה + עריכה</label>
    <textarea id="sEd" rows="3" readonly style="font-size:.75rem;direction:ltr">${editUrl}</textarea>
    <button class="btn btn-primary btn-sm" id="cpEd" style="margin-top:8px">העתק קישור עריכה</button>
    <p class="hint" style="margin-top:14px">💡 עריכות של הצד השני נשמרות אצלו בלבד. לאיחוד שינויים — שלחו קובץ מיוצא זה לזה. רוצה סנכרון אמיתי בין שניכם? אפשר לחבר את זה ל‑Google Sheets.</p>
  `);
  const cp=(txt)=>{navigator.clipboard?.writeText(txt).then(()=>toast('הקישור הועתק')).catch(()=>toast('בחר והעתק ידנית'));};
  $('#cpRo').onclick=()=>cp(url); $('#cpEd').onclick=()=>cp(editUrl);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(data.project.name||'apartment')+'-budget-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();toast('הקובץ יוצא');
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.categories||!j.items)throw 0;data=j;RO=false;save();toast('הנתונים יובאו');switchView('overview');}catch(e){toast('קובץ לא תקין');}};
  r.readAsText(file);
}

// ---------- helpers ----------
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(s){if(!s)return'';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('he-IL');}
// ניווט מבוסס היסטוריה — כפתור/מחוות "אחורה" סוגר חלוניות וחוזר בין מסכים במקום לצאת
const ovStack=[]; // מחסנית שכבות (חלוניות/לייטבוקס)
function pushOverlay(hideFn){ovStack.push(hideFn);history.pushState({ov:ovStack.length},'');}
function popOverlayUI(){const h=ovStack.pop();if(h)try{h();}catch(e){}}
function sheet(html){const wasOpen=$('#overlay').classList.contains('open');
  $('#sheet').innerHTML='<div class="grab"></div><button class="sheet-x" type="button" onclick="closeTop()" aria-label="סגור">✕</button>'+html;
  $('#overlay').classList.add('open');
  if(!wasOpen)pushOverlay(()=>$('#overlay').classList.remove('open'));}
function closeTop(){ if(ovStack.length)history.back(); }
function close(){ closeTop(); }
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}
let curView='overview';
function applyView(v){curView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const bk=$('#btnBack'); if(bk)bk.style.display=(v==='overview')?'none':'grid';
  const fab=$('#fab'); if(fab)fab.style.display=(!RO&&(v==='expenses'||v==='budget'))?'grid':'none'; // ＋ מוסיף קטגוריה, רק בתקציב/הוצאות
  window.scrollTo(0,0);
}
function switchView(v){ if(v===curView){applyView(v);return;} history.pushState({v:v},''); applyView(v); }
window.addEventListener('popstate',e=>{
  if(ovStack.length){popOverlayUI();return;}
  applyView((e.state&&e.state.v)||'overview');
});

// ---------- events ----------
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close();};
$('#fab').onclick=()=>RO?toast('מצב צפייה בלבד'):openCat();
$('#btnAddCat').onclick=()=>RO?toast('מצב צפייה בלבד'):openCat();
$('#btnAddCatBudget').onclick=()=>RO?toast('מצב צפייה בלבד'):openCat();
$('#btnShare').onclick=shareLink; $('#btnShare2').onclick=shareLink;
$('#btnSettingsTop').onclick=()=>switchView('settings');
$('#btnBack').onclick=()=>history.back();
$('#expSearch').oninput=e=>{expFilter=e.target.value.trim();renderCats();};
$('#budSearch').oninput=e=>{budFilter=e.target.value.trim();renderBudget();};
$('#headHero').onclick=()=>RO?null:switchView('settings');
$('#btnExport').onclick=exportJSON;
$('#btnImport').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);};
$('#btnReset').onclick=()=>{if(confirm('לאפס את כל הנתונים ולהתחיל מחדש?')){data=defaults();RO=false;save();switchView('overview');toast('אופס');}};

if(VIEW)RO=true;
try{history.replaceState({v:'overview'},'');}catch(e){}
initCloud();
render();
if(RO)toast(VIEW?'צפייה בלבד — מתעדכן אוטומטית':'נפתח במצב צפייה בלבד');

// ---------- בדיקת עדכון גרסה אוטומטית (עוקף מטמון) ----------
const BUILD=((document.documentElement.innerHTML.match(/VITKIN_BUILD=(\d+)/))||[])[1]||'0';
function hardReload(){const u=new URL(location.href);u.searchParams.set('cb',Date.now());location.replace(u.toString());}
function checkUpdate(){
  fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
    const m=t.match(/VITKIN_BUILD=(\d+)/);
    if(m&&m[1]!==BUILD&&!document.getElementById('updBar')){
      const bar=document.createElement('div');bar.id='updBar';
      bar.style.cssText='position:fixed;inset-inline:0;bottom:calc(74px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:92%;background:var(--brand);color:#fff;padding:11px 18px;border-radius:12px;z-index:250;box-shadow:0 8px 22px rgba(0,0,0,.3);font-weight:700;cursor:pointer';
      bar.textContent='🔄 עודכנה גרסה חדשה — הקש לרענון';
      bar.onclick=hardReload;document.body.appendChild(bar);
    }
  }).catch(()=>{});
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
</script>
</body>
</html>
